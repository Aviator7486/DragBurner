<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>92 Notchback vs 84 Firebird - 1/4 Mile Showdown</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
            touch-action: none;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #020208;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        #game-container {
            position: absolute;
            width: 932px;
            height: 430px;
            background: #000;
            overflow: hidden;
            border: none;
            border-radius: 0px;
            transform-origin: center center;
            box-shadow: none;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top HUD Layout - Translucent Glassmorphism with Vertical Stacking */
        #hud {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 18px;
            background: rgba(5, 5, 10, 0.65);
            padding: 6px 16px;
            border-radius: 10px;
            border: 1px solid rgba(85, 85, 85, 0.6);
            color: #fff;
            pointer-events: none;
            font-weight: bold;
            font-size: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .hud-col {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .hud-title {
            font-size: 10px;
            color: #aaa;
            margin-bottom: 2px;
        }
        .hud-val { color: #00ffcc; font-size: 13px; }
        .hud-ver { color: #ffcc00; font-size: 13px; }

        /* Telemetry Readout Containers - Translucent Glass Style */
        #player-et-box {
            position: absolute;
            top: 65px;
            left: 175px;
            z-index: 10;
            background: rgba(0, 0, 5, 0.82);
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 204, 0, 0.8);
            color: #ffcc00;
            font-weight: bold;
            font-size: 11px;
            display: none;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.25);
            text-align: center;
        }

        #reaction-box {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 5, 0.82);
            padding: 5px 14px;
            border-radius: 6px;
            border: 1px solid rgba(255, 204, 0, 0.8);
            color: #ffcc00;
            font-weight: bold;
            font-size: 11px;
            display: none;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.25);
            text-align: center;
        }

        #ai-et-box {
            position: absolute;
            top: 65px;
            right: 175px;
            z-index: 10;
            background: rgba(0, 0, 5, 0.82);
            padding: 5px 12px;
            border-radius: 6px;
            border: 1px solid rgba(255, 204, 0, 0.8);
            color: #ffcc00;
            font-weight: bold;
            font-size: 11px;
            display: none;
            letter-spacing: 0.5px;
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.25);
            text-align: center;
        }

        #rt-val { font-size: 12px; }

        /* Translucent Top Button Styles */
        .top-btn {
            position: absolute;
            z-index: 11;
            padding: 8px 12px;
            background: rgba(34, 34, 34, 0.65);
            color: #fff;
            border: 2px solid rgba(85, 85, 85, 0.8);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 145px;
            height: 34px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
            opacity: 0.85;
        }
        .top-btn:hover {
            background: rgba(51, 51, 51, 0.9);
            border-color: #00ffcc;
            color: #00ffcc;
            opacity: 1.0;
        }
        #pov-toggle {
            top: 15px;
            left: 20px;
        }
        #sound-toggle {
            top: 54px;
            left: 20px;
            border-color: rgba(255, 51, 51, 0.8);
            color: #ff3333;
        }
        #stage-btn {
            top: 15px;
            right: 20px;
            background: rgba(212, 163, 115, 0.75);
            color: #000;
            border: 2px solid #fff;
        }
        #stage-btn:hover {
            background: rgba(226, 180, 140, 0.95);
            color: #000;
        }

        /* Control Zones */
        .control-zone {
            position: absolute;
            bottom: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0.82;
            transition: opacity 0.2s;
        }
        .control-zone:hover { opacity: 0.98; }
        
        #left-controls {
            left: 30px;
            width: 110px;
            height: 224px;
        }
        #right-controls {
            right: 30px;
            width: 216px; 
            height: 312px; 
        }

        .btn {
            background: linear-gradient(135deg, rgba(51,51,51,0.7), rgba(17,17,17,0.7));
            border: 3px solid rgba(85,85,85,0.8);
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 4px 6px rgba(0,0,0,0.6);
        }
        .btn:active, .btn.active {
            background: linear-gradient(135deg, rgba(17,17,17,0.85), rgba(0,0,0,0.85));
            border-color: #888;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.8);
        }

        #btn-gas { height: 110px; background: linear-gradient(135deg, rgba(34,139,34,0.75), rgba(0,77,0,0.75)); border-color: rgba(0,255,0,0.8); font-size: 20px; }
        #btn-clutch-l { height: 99px; background: linear-gradient(135deg, rgba(68,68,68,0.7), rgba(34,34,34,0.7)); border-color: rgba(119,119,119,0.8); font-size: 16px; } 
        #btn-clutch-r { height: 45px; background: linear-gradient(135deg, rgba(68,68,68,0.7), rgba(34,34,34,0.7)); border-color: rgba(119,119,119,0.8); font-size: 14px; width: 100%; } 

        .nos-row {
            display: flex;
            gap: 10px;
            height: 45px; 
            width: 100%;
        }
        #btn-nos-arm { flex: 1; background: linear-gradient(135deg, rgba(139,0,0,0.75), rgba(77,0,0,0.75)); border-color: rgba(255,0,0,0.8); font-size: 10px; }
        #btn-nos-arm.armed { background: rgba(255, 51, 51, 0.9); border-color: #fff; color: #000; animation: pulse 0.5s infinite alternate; }
        #btn-nos-launch { flex: 1; background: linear-gradient(135deg, rgba(0,0,139,0.75), rgba(0,0,77,0.75)); border-color: rgba(0,0,255,0.8); font-size: 10px; }
        #btn-nos-launch.active { background: rgba(51, 51, 255, 0.95); border-color: #fff; }

        .shifter-quadrant {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            height: 198px; 
            background: rgba(26, 26, 26, 0.65);
            padding: 6px;
            border-radius: 14px;
            border: 3px solid rgba(68, 68, 68, 0.8);
        }
        .shift-gate {
            background: rgba(10, 10, 10, 0.65);
            border: 2px solid rgba(37, 37, 37, 0.8);
            color: #888;
            font-size: 21px; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        
        .shifter-quadrant .shift-gate.active {
            background: #ffcc00 !important;
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 8px #ffcc00 !important;
            opacity: 1 !important;
        }
        .shift-gate.blank { opacity: 0.15; }

        @keyframes pulse {
            from { box-shadow: 0 0 2px #ff0000; }
            to { box-shadow: 0 0 12px #ff0000; }
        }
    </style>
</head>
<body>

<div id="game-container">
    <button id="pov-toggle" class="top-btn">POV: OUTSIDE</button>
    <button id="sound-toggle" class="top-btn">🔇 SOUND: OFF</button>
    <button id="stage-btn" class="top-btn">STAGE CAR</button>

    <div id="hud">
        <div class="hud-col"><span class="hud-title">DIST</span><span id="hud-dist" class="hud-val">0 ft</span></div>
        <div class="hud-col"><span class="hud-title">GEAR</span><span id="hud-gear" class="hud-val">N</span></div>
        <div class="hud-col"><span class="hud-title">RPM</span><span id="hud-rpm" class="hud-val">1000</span></div>
        <div class="hud-col"><span class="hud-title">MPH</span><span id="hud-mph" class="hud-val">0</span></div>
        <div class="hud-col"><span class="hud-title">AI DIST</span><span id="hud-aidist" class="hud-val">0 ft</span></div>
        <div class="hud-col"><span class="hud-title">VER</span><span class="hud-ver">2.3</span></div>
    </div>

    <div id="player-et-box">MUSTANG ET: <span id="player-et-val" class="hud-val">--</span></div>
    <div id="reaction-box">REACTION TIME: <span id="rt-val">--</span></div>
    <div id="ai-et-box">FIREBIRD ET: <span id="ai-et-val" class="hud-val">--</span></div>

    <div class="control-zone" id="left-controls">
        <div class="btn" id="btn-gas">GAS</div>
        <div class="btn" id="btn-clutch-l">CLUTCH</div>
    </div>

    <div class="control-zone" id="right-controls">
        <div class="nos-row">
            <div class="btn" id="btn-nos-arm">N2O ARM</div>
            <div class="btn" id="btn-nos-launch">N2O ENGAGE</div>
        </div>
        
        <div class="shifter-quadrant" id="quadrant-zone">
            <div class="shift-gate" data-gear="1" data-x="0" data-y="0">1</div>
            <div class="shift-gate" data-gear="3" data-x="1" data-y="0">3</div>
            <div class="shift-gate" data-gear="5" data-x="2" data-y="0">5</div>
            <div class="shift-gate blank" data-x="0" data-y="1"></div>
            <div class="shift-gate active" data-gear="0" data-x="1" data-y="1">N</div>
            <div class="shift-gate blank" data-x="2" data-y="1"></div>
            <div class="shift-gate" data-gear="2" data-x="0" data-y="2">2</div>
            <div class="shift-gate" data-gear="4" data-x="1" data-y="2">4</div>
            <div class="shift-gate" data-gear="6" data-x="2" data-y="2">6</div>
        </div>

        <div class="btn" id="btn-clutch-r">CLUTCH</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function scaleGameViewport() {
        const baseWidth = 932;
        const baseHeight = 430;
        let scaleFactor = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
        container.style.transform = `scale(${scaleFactor})`;
        canvas.width = baseWidth;
        canvas.height = baseHeight;
    }
    window.addEventListener('resize', scaleGameViewport);
    scaleGameViewport();

    let state = {
        pov: 'outside', 
        raceState: 'idle', 
        time: 0,
        distance: 0, 
        speed: 0, 
        gear: 0, 
        attemptedGear: 0, 
        rpm: 1000,
        aiDistance: 0,
        aiSpeed: 0,
        aiFinished: false,
        playerFinished: false,
        playerEt: null,
        aiEt: null,
        clutchLeft: false,
        clutchRight: false,
        gas: false,
        gasSource: 'keyboard',
        nosArmed: false,
        nosEngaged: false,
        treeTimer: 0,
        treeStep: 0,
        startTime: 0,
        logMsg: "",
        shiftError: false,
        screechPlayed: false,
        muted: true,
        reactionTime: null
    };

    let shifterX = 1; 
    let shifterY = 1; 
    let lastTime = performance.now();

    const MAX_RPM = 7500;
    const REDLINE = 6800;
    const IDLE_RPM = 1000;
    const GEAR_RATIOS = [0, 2.90, 2.10, 1.64, 1.33, 1.10, 0.92]; 
    const FINAL_DRIVE = 4.10;
    const VELOCITY_CONSTANT = 6.989; 

    // --- SYNTHESIZED AUDIO ENGINE (PURE DIRECT WEBAUDIO WITH AUTO-RESUME) ---
    const AudioEngine = {
        ctx: null,
        masterGain: null,
        engineOsc1: null,
        engineOsc2: null,
        engineGain: null,
        windNoiseNode: null,
        windGainNode: null,
        squealOsc: null,
        squealGain: null,
        squealFilter: null,
        initialized: false,

        async init() {
            if (this.initialized) {
                await this.ensureResumed();
                return;
            }

            try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                
                // Pure direct speaker connection
                this.masterGain.connect(this.ctx.destination);
                this.masterGain.gain.setValueAtTime(state.muted ? 0 : 1, this.ctx.currentTime);

                // Powertrain Oscillators
                this.engineOsc1 = this.ctx.createOscillator();
                this.engineOsc2 = this.ctx.createOscillator();
                this.engineGain = this.ctx.createGain();
                this.engineOsc1.type = 'sawtooth';
                this.engineOsc2.type = 'triangle';

                let lowpass = this.ctx.createBiquadFilter();
                lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(280, this.ctx.currentTime);

                this.engineOsc1.connect(lowpass);
                this.engineOsc2.connect(lowpass);
                lowpass.connect(this.engineGain);
                this.engineGain.connect(this.masterGain);
                this.engineGain.gain.setValueAtTime(0.12, this.ctx.currentTime);

                this.engineOsc1.start(0);
                this.engineOsc2.start(0);

                // Wind Noise Generator
                let bufferSize = 2 * this.ctx.sampleRate;
                let noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                let output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                this.windNoiseNode = this.ctx.createBufferSource();
                this.windNoiseNode.buffer = noiseBuffer;
                this.windNoiseNode.loop = true;
                
                let windFilter = this.ctx.createBiquadFilter();
                windFilter.type = 'lowpass';
                windFilter.frequency.setValueAtTime(180, this.ctx.currentTime);
                this.windGainNode = this.ctx.createGain();
                this.windGainNode.gain.setValueAtTime(0.0, this.ctx.currentTime);

                this.windNoiseNode.connect(windFilter);
                windFilter.connect(this.windGainNode);
                this.windGainNode.connect(this.masterGain);
                this.windNoiseNode.start(0);

                // Continuous Launch Tire Squeal Synthesizer
                this.squealOsc = this.ctx.createOscillator();
                this.squealOsc.type = 'sawtooth';
                this.squealOsc.frequency.setValueAtTime(1850, this.ctx.currentTime);

                this.squealFilter = this.ctx.createBiquadFilter();
                this.squealFilter.type = 'bandpass';
                this.squealFilter.frequency.setValueAtTime(2100, this.ctx.currentTime);
                this.squealFilter.Q.setValueAtTime(4.5, this.ctx.currentTime);

                this.squealGain = this.ctx.createGain();
                this.squealGain.gain.setValueAtTime(0.0, this.ctx.currentTime);

                this.squealOsc.connect(this.squealFilter);
                this.squealFilter.connect(this.squealGain);
                this.squealGain.connect(this.masterGain);
                this.squealOsc.start(0);

                this.initialized = true;
                await this.ensureResumed();
            } catch (e) {
                console.error("Audio engine setup failed:", e);
            }
        },

        async ensureResumed() {
            if (this.ctx && this.ctx.state === 'suspended') {
                await this.ctx.resume();
            }
        },

        async setMute(isMuted) {
            if (!this.initialized) await this.init();
            await this.ensureResumed();
            this.masterGain.gain.setValueAtTime(isMuted ? 0 : 1, this.ctx.currentTime);
        },

        update(rpm, speed, gas, isSpinning) {
            if (!this.initialized) return;
            let baseFreq = 22 + (rpm / 24);
            this.engineOsc1.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
            this.engineOsc2.frequency.setValueAtTime(baseFreq * 0.5, this.ctx.currentTime);

            let loadGain = gas ? 0.22 : 0.08;
            if (state.gear === 0) loadGain *= 0.7;
            this.engineGain.gain.setValueAtTime(loadGain, this.ctx.currentTime);

            let mph = speed * 0.681818;
            this.windGainNode.gain.setValueAtTime(Math.min(mph / 320, 0.25), this.ctx.currentTime);

            if (isSpinning && !state.muted) {
                let targetGain = Math.min(0.28, 0.12 + (rpm / 7500) * 0.18);
                this.squealGain.gain.setValueAtTime(targetGain, this.ctx.currentTime);
                let sqPitch = 1750 + (speed * 8.0) + (Math.random() * 80);
                this.squealOsc.frequency.setValueAtTime(sqPitch, this.ctx.currentTime);
            } else {
                this.squealGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
            }
        },

        // High-RPM Gear Shift Tire Bark
        async playTireChirp() {
            if (state.muted) return;
            if (!this.initialized) await this.init();
            await this.ensureResumed();

            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            let filter = this.ctx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(2400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1300, this.ctx.currentTime + 0.16);

            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(2200, this.ctx.currentTime);
            filter.Q.setValueAtTime(4.0, this.ctx.currentTime);

            gain.gain.setValueAtTime(0.38, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);

            osc.start(0);
            osc.stop(this.ctx.currentTime + 0.16);
        },

        // Hard Launch Tire Screech Sweep
        async playScreech() {
            if (state.muted) return;
            if (!this.initialized) await this.init();
            await this.ensureResumed();

            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(880, this.ctx.currentTime);
            osc.frequency.linearRampToValueAtTime(1200, this.ctx.currentTime + 0.25);
            
            let filter = this.ctx.createBiquadFilter();
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(1500, this.ctx.currentTime);

            gain.gain.setValueAtTime(0.18, this.ctx.currentTime);
            gain.gain.linearRampToValueAtTime(0.001, this.ctx.currentTime + 0.35);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);
            osc.start(0);
            osc.stop(this.ctx.currentTime + 0.4);
        },

        async playTone(freq, type, duration, volume) {
            if (state.muted) return;
            if (!this.initialized) await this.init();
            await this.ensureResumed();

            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain);
            gain.connect(this.masterGain);
            osc.start(0);
            osc.stop(this.ctx.currentTime + duration);
        },

        async playGrind() {
            if (state.muted) return;
            if (!this.initialized) await this.init();
            await this.ensureResumed();
            this.playTone(140, 'sawtooth', 0.22, 0.35);
            this.playTone(145, 'triangle', 0.22, 0.35);
        }
    };

    const UI = {
        gas: document.getElementById('btn-gas'),
        clutchL: document.getElementById('btn-clutch-l'),
        clutchR: document.getElementById('btn-clutch-r'),
        nosArm: document.getElementById('btn-nos-arm'),
        nosLaunch: document.getElementById('btn-nos-launch'),
        pov: document.getElementById('pov-toggle'),
        sound: document.getElementById('sound-toggle'),
        stage: document.getElementById('stage-btn'),
        quadrant: document.getElementById('quadrant-zone'),
        gates: document.querySelectorAll('.shift-gate'),
        hudDist: document.getElementById('hud-dist'),
        hudGear: document.getElementById('hud-gear'),
        hudRpm: document.getElementById('hud-rpm'),
        hudMph: document.getElementById('hud-mph'),
        hudAiDist: document.getElementById('hud-aidist'),
        playerEtBox: document.getElementById('player-et-box'),
        playerEtVal: document.getElementById('player-et-val'),
        aiEtBox: document.getElementById('ai-et-box'),
        aiEtVal: document.getElementById('ai-et-val'),
        reactionBox: document.getElementById('reaction-box'),
        rtVal: document.getElementById('rt-val')
    };

    // Global User Interaction Audio Unlock
    async function globalUnlockAudio() {
        if (!AudioEngine.initialized) {
            await AudioEngine.init();
        } else {
            await AudioEngine.ensureResumed();
        }
    }
    window.addEventListener('touchstart', globalUnlockAudio, { passive: true });
    window.addEventListener('mousedown', globalUnlockAudio);
    window.addEventListener('keydown', globalUnlockAudio);

    function bindButton(element, onPress, onRelease, isGasPedal = false) {
        element.addEventListener('touchstart', async (e) => { 
            e.preventDefault(); 
            await globalUnlockAudio();
            element.classList.add('active'); 
            if (isGasPedal) state.gasSource = 'touch';
            onPress(); 
        }, { passive: false });

        element.addEventListener('touchend', (e) => { 
            e.preventDefault(); 
            element.classList.remove('active'); 
            onRelease(); 
        }, { passive: false });

        element.addEventListener('touchcancel', (e) => { 
            e.preventDefault(); 
            element.classList.remove('active'); 
            onRelease(); 
        }, { passive: false });

        element.addEventListener('mousedown', async () => { 
            await globalUnlockAudio();
            element.classList.add('active'); 
            if (isGasPedal) state.gasSource = 'touch';
            onPress(); 
        });

        element.addEventListener('mouseup', () => { 
            element.classList.remove('active'); 
            onRelease(); 
        });

        element.addEventListener('mouseleave', () => { 
            if (element.classList.contains('active')) { 
                element.classList.remove('active'); 
                onRelease(); 
            } 
        });
    }

    // ALWAYS-ACTIVE CONTROL BINDINGS

    // --- MECHANICAL SHIFTER ENGINE WITH HIGH-RPM TIRE CHIRP ---
    function attemptMoveShifter(tx, ty) {
        let currentY = shifterY;
        let clutchPressed = state.clutchLeft || state.clutchRight;
        
        if (currentY === 1 && (ty === 0 || ty === 2)) {
            let targetGear = 0;
            if (ty === 0) {
                if (tx === 0) targetGear = 1;
                if (tx === 1) targetGear = 3;
                if (tx === 2) targetGear = 5;
            } else if (ty === 2) {
                if (tx === 0) targetGear = 2;
                if (tx === 1) targetGear = 4;
                if (tx === 2) targetGear = 6;
            }
            
            if (clutchPressed) {
                shifterX = tx;
                shifterY = ty;
                state.shiftError = false;
                if (state.gear !== targetGear) {
                    let oldRpm = state.rpm;
                    state.gear = targetGear;
                    
                    if (state.gear !== 0) {
                        if (oldRpm > 3800 && state.gas) {
                            AudioEngine.playTireChirp();
                        } else {
                            AudioEngine.playTone(580, 'sine', 0.04, 0.25);
                        }
                    }
                }
            } else {
                shifterX = tx;
                shifterY = 1; 
                state.gear = 0; 
                state.attemptedGear = targetGear; 
                state.shiftError = true;
                AudioEngine.playGrind();
            }
        } 
        else if ((currentY === 0 || currentY === 2) && ty === 1) {
            shifterX = tx; shifterY = 1; state.gear = 0; state.shiftError = false;
        } 
        else if (currentY === 1 && ty === 1) {
            shifterX = tx; shifterY = 1; state.gear = 0; state.shiftError = false;
        }
        updateShifterVisuals();
    }

    function processShiftAtCoords(clientX, clientY) {
        let targetElement = document.elementFromPoint(clientX, clientY);
        if (targetElement && targetElement.classList.contains('shift-gate')) {
            let tx = parseInt(targetElement.getAttribute('data-x'));
            let ty = parseInt(targetElement.getAttribute('data-y'));
            
            if (shifterX !== tx || shifterY !== ty) {
                let dx = Math.abs(tx - shifterX);
                let dy = Math.abs(ty - shifterY);
                
                if ((dx + dy === 1) && (dy === 0 ? shifterY === 1 : true)) {
                    attemptMoveShifter(tx, ty);
                }
            }
        }
    }

    UI.quadrant.addEventListener('touchmove', (e) => { 
        let rect = UI.quadrant.getBoundingClientRect();
        for (let i = 0; i < e.touches.length; i++) {
            let t = e.touches[i];
            if (t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                processShiftAtCoords(t.clientX, t.clientY);
            }
        }
    }, { passive: true });

    UI.quadrant.addEventListener('touchstart', (e) => { 
        let rect = UI.quadrant.getBoundingClientRect();
        for (let i = 0; i < e.touches.length; i++) {

            if (t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
                processShiftAtCoords(t.clientX, t.clientY);
            }
        }
    }, { passive: true });

    // Keyboard Input Processing
    window.addEventListener('keydown', async (e) => {
        await globalUnlockAudio();
        if (['arrowup', 'arrowdown', 'arrowleft', 'arrowright'].includes(e.key.toLowerCase())) e.preventDefault();

                break;
            case 'c': state.clutchLeft = true; state.clutchRight = true; UI.clutchL.classList.add('active'); UI.clutchR.classList.add('active'); break;
            case 'a': state.nosArmed = !state.nosArmed; UI.nosArm.classList.toggle('armed', state.nosArmed); break;
            case 'n': state.nosEngaged = true; UI.nosLaunch.classList.add('active'); break;
            case 'arrowup': if (shifterY > 0) attemptMoveShifter(shifterX, shifterY - 1); break;
            case 'arrowdown': if (shifterY < 2) attemptMoveShifter(shifterX, shifterY + 1); break;
            case 'arrowleft': if (shifterY === 1 && shifterX > 0) attemptMoveShifter(shifterX - 1, shifterY); break;
            case 'arrowright': if (shifterY === 1 && shifterX < 2) attemptMoveShifter(shifterX + 1, shifterY); break;
        }
    });

    function updateShifterVisuals() {
        UI.gates.forEach(g => {
            let gx = parseInt(g.getAttribute('data-x'));
            let gy = parseInt(g.getAttribute('data-y'));
            if (gx === shifterX && gy === shifterY) g.classList.add('active');
            else g.classList.remove('active');
        });
    }

    function resetRace() {
        state.time = 0; state.distance = 0; state.speed = 0; state.gear = 0; state.rpm = IDLE_RPM;
        state.aiDistance = 0; state.aiSpeed = 0; 
        state.aiFinished = false; state.playerFinished = false;
        state.playerEt = null; state.aiEt = null;
        state.raceState = 'idle'; state.logMsg = ""; 
        shifterX = 1; shifterY = 1; 
        state.shiftError = false;
        state.screechPlayed = false;
        state.reactionTime = null;
        updateShifterVisuals();
        lastTime = performance.now(); 
    }

    function getProjection(objDistance, laneOffset = 0) {
        let diff = objDistance - state.distance;
        let horizon = canvas.height * 0.45;
        let playerY = canvas.height * 0.85;
        let horizonX = canvas.width * 0.5; 
        let camOffsetLane = 0;            
        
        if (state.pov === 'inside') camOffsetLane = -1; 
        
        let y = horizon + (playerY - horizon) / (1 + diff * 0.012);
        let scale = (y - horizon) / (playerY - horizon);
        let laneSpacing = canvas.width * 0.24;
        let x = horizonX + (laneOffset - camOffsetLane) * laneSpacing * scale;
        
        return { x: x, y: y, scale: scale, visible: (diff > -55 && diff < 1200) };
    }

    // --- REAL-TIME PHYSICS ENGINE ---
    function updatePhysics(dt) {
        let clutchPressed = state.clutchLeft || state.clutchRight;

        if ((state.raceState === 'countdown' || state.raceState === 'staging') && !clutchPressed && state.gear !== 0) {
            state.raceState = 'foul'; 
            state.treeStep = 7; 
            state.logMsg = "FOUL! JUMPED THE TREE!";
            state.reactionTime = -0.001;
            AudioEngine.playTone(220, 'sawtooth', 0.6, 0.45); 
        }

        if (state.raceState === 'staging' || state.raceState === 'countdown') {
            let oldStep = state.treeStep;
            state.treeTimer += dt;
            if (state.treeStep === 1 && state.treeTimer > 0.6) { state.treeStep = 2; state.treeTimer = 0; state.raceState = 'countdown'; } 
            if (state.treeStep === 2 && state.treeTimer > 0.5) { state.treeStep = 3; state.treeTimer = 0; } 
            if (state.treeStep === 3 && state.treeTimer > 0.5) { state.treeStep = 4; state.treeTimer = 0; } 
            if (state.treeStep === 4 && state.treeTimer > 0.5) { state.treeStep = 5; state.treeTimer = 0; } 
            if (state.treeStep === 5 && state.treeTimer > 0.5) { 
                state.treeStep = 6; state.treeTimer = 0; state.raceState = 'racing'; state.startTime = performance.now();
            }

            if (state.treeStep !== oldStep) {
                if (state.treeStep >= 3 && state.treeStep <= 5) {
                    AudioEngine.playTone(440, 'sine', 0.12, 0.3); 
                } else if (state.treeStep === 6) {
                    AudioEngine.playTone(880, 'sine', 0.40, 0.4); 
                }
            }
        }

        let isTireSpinning = false;

        // ================= PLAYER VEHICLE MECHANICAL PATHWAY =================
        if (state.gear === 0 || clutchPressed) {
            if (state.gas) {
                state.rpm += 18000 * dt; 
                if (state.rpm > MAX_RPM) state.rpm = MAX_RPM - (Math.random() * 150); 
            } else {
                state.rpm -= 7000 * dt;
                if (state.rpm < IDLE_RPM) state.rpm = IDLE_RPM;
            }
            
            let dragDecel = (state.speed * state.speed * 0.0004) + 4.0;
            state.speed -= dragDecel * dt;
            if (state.speed < 0) state.speed = 0;
            state.distance += state.speed * dt;
        } else {
            let ratioMult = GEAR_RATIOS[state.gear] * FINAL_DRIVE * VELOCITY_CONSTANT;
            let mechanicalRpm = IDLE_RPM + (state.speed * ratioMult);

            if (state.raceState === 'racing' && state.reactionTime === null) {
                let calculatedReaction = (performance.now() - state.startTime) / 1000;
                state.reactionTime = calculatedReaction;
                
                if (calculatedReaction < 0.12) {
                    state.raceState = 'foul';
                    state.treeStep = 7;
                    state.logMsg = `FOUL! TOO FAST FOR GLASS! RT: ${calculatedReaction.toFixed(3)}s`;
                    AudioEngine.playTone(220, 'sawtooth', 0.6, 0.45);
                }
            }

            if (mechanicalRpm > MAX_RPM) {
                let overRev = mechanicalRpm - MAX_RPM;
                let brakingForce = -400 - (overRev * 0.5); 
                state.speed += brakingForce * dt;
                if (state.speed < 0) state.speed = 0;
                state.rpm = MAX_RPM; 
                state.shiftError = true;
                state.distance += state.speed * dt;
            } else {
                if (state.rpm > mechanicalRpm) {
                    state.rpm -= (state.rpm - mechanicalRpm) * 12 * dt; 
                } else {
                    state.rpm = mechanicalRpm;
                }

                let torqueFactor = 0;
                if (state.rpm < 2000) {
                    torqueFactor = 0.15 + ((state.rpm - IDLE_RPM) / 1000) * 0.25;
                } else if (state.rpm >= 2000 && state.rpm < 4500) {
                    torqueFactor = 0.40 + ((state.rpm - 2000) / 2500) * 0.55;
                } else if (state.rpm >= 4500 && state.rpm <= 6800) {
                    torqueFactor = 0.95 + Math.sin(((state.rpm - 4500) / 2300) * Math.PI) * 0.05;
                } else {
                    let overPeakPct = (state.rpm - 6800) / (MAX_RPM - 6800);
                    torqueFactor = 1.0 - (overPeakPct * overPeakPct * 0.35);
                }

                // Launch tire screech trigger
                if (state.speed === 0 && state.distance === 0 && state.raceState === 'racing' && !state.screechPlayed) {
                    AudioEngine.playScreech();
                    state.screechPlayed = true;
                }

                if (state.gear === 1 && state.gas && state.rpm > 3200 && state.speed < 55) {
                    isTireSpinning = true;
                }

                // DUAL-INPUT GAIN CALIBRATOR (2.5 Multiplier for Touchscreen)
                const TOUCH_HP_SCALE = 2.5;
                let touchMultiplier = (state.gasSource === 'touch') ? TOUCH_HP_SCALE : 1.0;

                let nosBoost = (state.nosEngaged || (state.nosArmed && state.gas)) ? 2.5 : 1.0; 
                const MONSTER_HP_SCALE = 45.0; 

                let engineForce = 0;
                if (state.gas) {
                    engineForce = torqueFactor * GEAR_RATIOS[state.gear] * nosBoost * MONSTER_HP_SCALE * touchMultiplier;
                }

                let aeroDrag = state.speed * state.speed * 0.0005;
                let mechanicalFriction = 8.0;
                let engineBraking = state.gas ? 0 : 40.0;

                let netForce = engineForce - (aeroDrag + mechanicalFriction + engineBraking);
                if (state.speed === 0 && netForce <= 0) netForce = 0;

                state.speed += netForce * dt;
                if (state.speed < 0) state.speed = 0;
                state.distance += state.speed * dt;
            }
        }

        // ================= UNIFIED OMNIPRESENT AI VEHICLE PROCESSOR =================
        let aiGear = 1;
        if (state.time > 1.2) aiGear = 2;
        if (state.time > 2.6) aiGear = 3;
        if (state.time > 4.2) aiGear = 4;
        if (state.time > 6.2) aiGear = 5;

        if (state.raceState === 'racing' || state.raceState === 'finished') {
            state.time = (performance.now() - state.startTime) / 1000;
        }

        if (state.raceState === 'racing' || (state.raceState === 'finished' && !state.aiFinished)) {
            let aiAcc = (80.0 / aiGear) - (state.aiSpeed * 0.065);
            
            if ((state.time > 1.15 && state.time < 1.25) || (state.time > 2.55 && state.time < 2.65) || 
                (state.time > 4.15 && state.time < 4.25) || (state.time > 6.15 && state.time < 6.25)) {
                aiAcc = -10; 
            }
            state.aiSpeed += aiAcc * dt;
        } else if (state.aiFinished || state.raceState === 'foul') {
            let aiAirDrag = state.aiSpeed * state.aiSpeed * 0.0005;
            state.aiSpeed -= (aiAirDrag + 15.0) * dt;
        } else {
            state.aiSpeed = 0;
        }

        if (state.aiSpeed < 0) state.aiSpeed = 0;

        if (state.raceState === 'racing' || state.raceState === 'finished' || state.raceState === 'foul') {
            state.aiDistance += state.aiSpeed * dt;
        }

        // ================= TRAP LINE WIN EVALUATIONS & INDEPENDENT ET RECORDING =================
        if (state.raceState === 'racing' || state.raceState === 'finished') {
            if (state.distance >= 1320 && !state.playerFinished) {
                state.playerFinished = true;
                state.playerEt = state.time;
                if (state.raceState === 'racing') {
                    state.raceState = 'finished';
                    state.logMsg = "PLAYER WINS! (92 NOTCHBACK)";
                    AudioEngine.playTone(660, 'sine', 0.5, 0.3);
                }
            }

            if (state.aiDistance >= 1320 && !state.aiFinished) {
                state.aiFinished = true;
                state.aiEt = state.time;
                if (state.raceState === 'racing') {
                    state.raceState = 'finished';
                    state.logMsg = "AI WINS! (84 FIREBIRD)";
                    AudioEngine.playTone(330, 'sine', 0.5, 0.3);
                }
            }
        }

        AudioEngine.update(state.rpm, state.speed, state.gas, isTireSpinning);
    }

    function updateHUD() {
        UI.hudDist.innerText = Math.floor(state.distance) + " ft";
        UI.hudGear.innerText = state.gear !== 0 ? state.gear : (state.shiftError ? state.attemptedGear : "N");
        UI.hudRpm.innerText = Math.floor(state.rpm);

            }
        } else {
            UI.reactionBox.style.display = 'none';
        }
    }

    function draw() {
        let horizon = canvas.height * 0.45;
        
        let skyGrad = ctx.createLinearGradient(0,0,0,horizon);
        skyGrad.addColorStop(0, '#020208'); skyGrad.addColorStop(1, '#181326');
        ctx.fillStyle = skyGrad; ctx.fillRect(0, 0, canvas.width, horizon);

        ctx.fillStyle = '#1b1b1b'; ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);

        let pFarLeft = getProjection(state.distance + 1000, -2.0);   
        let pCloseLeft = getProjection(state.distance, -2.0);        
        let pFarRight = getProjection(state.distance + 1000, 2.0);   
        let pCloseRight = getProjection(state.distance, 2.0);        

        ctx.fillStyle = '#0f0f14';
        ctx.beginPath();
        ctx.moveTo(pFarLeft.x, horizon); ctx.lineTo(pCloseLeft.x, canvas.height);
        ctx.lineTo(pCloseRight.x, canvas.height); ctx.lineTo(pFarRight.x, horizon);
        ctx.closePath(); ctx.fill();

        ctx.strokeStyle = '#444';
        let dashLength = 16;
        let dashGap = 20;
        let stride = dashLength + dashGap;
        let lineStart = Math.floor(state.distance / stride) * stride - stride;

        for (let d = lineStart; d < state.distance + 800; d += stride) {
            let pStartLeft = getProjection(d + dashLength, -1.0);
            let pEndLeft = getProjection(d, -1.0);
            let pStartRight = getProjection(d + dashLength, 1.0);
            let pEndRight = getProjection(d, 1.0);

            if (pStartLeft.visible && pEndLeft.visible) {
                ctx.lineWidth = 2.5 * pEndLeft.scale; 
                ctx.beginPath(); ctx.moveTo(pStartLeft.x, pStartLeft.y); ctx.lineTo(pEndLeft.x, pEndLeft.y); ctx.stroke();
            }
            if (pStartRight.visible && pEndRight.visible) {
                ctx.lineWidth = 2.5 * pEndRight.scale;
                ctx.beginPath(); ctx.moveTo(pStartRight.x, pStartRight.y); ctx.lineTo(pEndRight.x, pEndRight.y); ctx.stroke();
            }
        }

        let finishProj = getProjection(1320, 0);
        if (finishProj.visible) {
            let fL = getProjection(1320, -2.0);
            let fR = getProjection(1320, 2.0);

            ctx.fillStyle = '#e65c00'; ctx.fillRect(fL.x, finishProj.y, fR.x - fL.x, 6 * finishProj.scale);
            ctx.strokeStyle = '#fff'; ctx.lineWidth = 3 * finishProj.scale; ctx.setLineDash([4 * finishProj.scale, 4 * finishProj.scale]);
            ctx.beginPath(); ctx.moveTo(fL.x, finishProj.y + 2); ctx.lineTo(fR.x, finishProj.y + 2); ctx.stroke(); ctx.setLineDash([]);

            ctx.strokeStyle = '#555'; ctx.lineWidth = 5 * finishProj.scale;
            ctx.strokeRect(fL.x - 5, finishProj.y - 240 * finishProj.scale, (fR.x - fL.x) + 10, 240 * finishProj.scale);
            ctx.fillStyle = '#ffcc00'; ctx.font = `bold ${Math.floor(13 * finishProj.scale)}px sans-serif`; ctx.textAlign = 'center';
            ctx.fillText("1/4 MILE TRAP", finishProj.x, finishProj.y - 210 * finishProj.scale);
        }

        let wallStart = Math.floor(state.distance / 30) * 30 - 30;
        for (let d = wallStart; d < state.distance + 700; d += 30) {
            let p1 = getProjection(d, 0);
            let p2 = getProjection(d + 15, 0);
            if (p1.visible && p2.visible) {
                ctx.fillStyle = (Math.floor(d / 30) % 2 === 0) ? '#5c5c64' : '#4c4c52';
                ctx.beginPath();
                ctx.moveTo(p1.x - 3 * p1.scale, p1.y);
                ctx.lineTo(p1.x - 1 * p1.scale, p1.y - 12 * p1.scale);
                ctx.lineTo(p2.x - 1 * p2.scale, p2.y - 12 * p2.scale);
                ctx.lineTo(p2.x - 3 * p2.scale, p2.y);
                ctx.closePath(); ctx.fill();

                ctx.fillStyle = '#7c7c84';
                ctx.beginPath();
                ctx.moveTo(p1.x - 1 * p1.scale, p1.y - 12 * p1.scale);
                ctx.lineTo(p1.x + 1 * p1.scale, p1.y - 12 * p1.scale);
                ctx.lineTo(p2.x + 1 * p2.scale, p2.y - 12 * p2.scale);
                ctx.lineTo(p2.x - 1 * p2.scale, p2.y - 12 * p2.scale);
                ctx.closePath(); ctx.fill();
            }
        }

        let aiProj = getProjection(state.aiDistance, 1);
        if (aiProj.visible) drawOutsideFirebird(aiProj.x, aiProj.y, aiProj.scale);

        let treeProj = getProjection(60, 0);
        if (treeProj.visible) {
            drawTree(treeProj.x, treeProj.y - 130 * treeProj.scale, treeProj.scale);
        }

        if (state.pov === 'outside') {
            let playerProj = getProjection(state.distance, -1);
            drawOutsideMustang(playerProj.x, playerProj.y, 1);
        } else {
            drawInsideCockpit();
        }

        if (state.logMsg !== "") {
            ctx.font = 'bold 14px Courier New'; 
            let textMetrics = ctx.measureText(state.logMsg);
            let boxWidth = textMetrics.width + 30; 
            let boxHeight = 40;
            let boxX = (canvas.width - boxWidth) / 2;
            let boxY = (canvas.height - boxHeight) / 2 - 15;

            ctx.fillStyle = 'rgba(2, 2, 6, 0.92)'; ctx.fillRect(boxX, boxY, boxWidth, boxHeight);
            ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 2; ctx.strokeRect(boxX, boxY, boxWidth, boxHeight);
            ctx.fillStyle = '#fff'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(state.logMsg, canvas.width * 0.5, boxY + boxHeight / 2);
            ctx.textBaseline = 'alphabetic'; 
        }
    }

    function drawTree(x, y, scale) {
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
        ctx.fillStyle = '#222'; ctx.fillRect(-12, -80, 24, 250);
        ctx.strokeStyle = '#444'; ctx.strokeRect(-12, -80, 24, 250);

        function drawLight(row, offset, color, lit) {
            ctx.fillStyle = lit ? color : '#332200'; ctx.beginPath();
            ctx.arc(offset, -70 + (row * 14), 5, 0, Math.PI * 2); ctx.fill();
            if(lit) {
                ctx.shadowBlur = 15; ctx.shadowColor = color; ctx.fillStyle = '#fff';
                ctx.beginPath(); ctx.arc(offset, -70 + (row * 14), 2, 0, Math.PI * 2); ctx.fill();
                ctx.shadowBlur = 0; 
            }
        }
        drawLight(0, -6, '#fff', state.treeStep >= 1); drawLight(0, 6, '#fff', state.treeStep >= 1);   
        drawLight(1, -6, '#fff', state.treeStep >= 2); drawLight(1, 6, '#fff', state.treeStep >= 2);   
        drawLight(2, -6, '#ffaa00', state.treeStep >= 3); drawLight(2, 6, '#ffaa00', state.treeStep >= 3);
        drawLight(3, -6, '#ffaa00', state.treeStep >= 4); drawLight(3, 6, '#ffaa00', state.treeStep >= 4);
        drawLight(4, -6, '#ffaa00', state.treeStep >= 5); drawLight(4, 6, '#ffaa00', state.treeStep >= 5);
        drawLight(5, -6, '#00ff00', state.treeStep === 6); drawLight(5, 6, '#00ff00', state.treeStep === 6);
        drawLight(6, 0, '#ff0000', state.treeStep === 7); 
        ctx.restore();
    }

    function drawOutsideMustang(x, y, scale) {
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
        let w = 110;
        ctx.fillStyle = '#050505'; ctx.fillRect(-12, -22, 24, 16);
        ctx.strokeStyle = '#cc0000'; ctx.strokeRect(-12, -22, 24, 16);

        ctx.fillStyle = '#b30000'; ctx.beginPath();
        ctx.moveTo(-w/2, 0); ctx.lineTo(-w/2 + 4, -25); ctx.lineTo(-w/3, -32);
        ctx.lineTo(w/3, -32); ctx.lineTo(w/2 - 4, -25); ctx.lineTo(w/2, 0);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#111'; ctx.beginPath();
        ctx.moveTo(-w/3 + 4, -32); ctx.lineTo(-w/4, -55); ctx.lineTo(w/4, -55); ctx.lineTo(w/3 - 4, -32);
        ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#b30000'; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = '#1c252e'; ctx.beginPath();
        ctx.moveTo(-w/3 + 8, -34); ctx.lineTo(-w/4 + 3, -52); ctx.lineTo(w/4 - 3, -52); ctx.lineTo(w/3 - 8, -34);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#200'; ctx.fillRect(-w/2 + 8, -20, 26, 12); ctx.fillRect(w/2 - 34, -20, 26, 12);
        ctx.fillStyle = '#ff0000'; ctx.fillRect(-w/2 + 10, -18, 22, 3); ctx.fillRect(-w/2 + 10, -11, 22, 3);
        ctx.fillRect(w/2 - 32, -18, 22, 3); ctx.fillRect(w/2 - 32, -11, 22, 3);

        ctx.fillStyle = '#0a0a0a'; ctx.fillRect(-w/2 + 2, 0, 22, 18); ctx.fillRect(w/2 - 24, 0, 22, 18);
        if (state.nosEngaged || (state.nosArmed && state.gas)) {
            ctx.fillStyle = 'rgba(0, 220, 255, 0.75)';
            for (let i = 0; i < 4; i++) {
                ctx.beginPath(); ctx.arc(-w/3 - (Math.random()*12), -38 - (Math.random()*8), 3 + Math.random()*5, 0, Math.PI*2);
                ctx.arc(w/3 + (Math.random()*12), -38 - (Math.random()*8), 3 + Math.random()*5, 0, Math.PI*2); ctx.fill();
            }
        }
        ctx.restore();
    }

    function drawOutsideFirebird(x, y, scale) {
        ctx.save(); ctx.translate(x, y); ctx.scale(scale, scale);
        let w = 114; 
        ctx.fillStyle = '#2b2e33'; ctx.beginPath();
        ctx.moveTo(-w/2, 0); ctx.lineTo(-w/2 + 2, -20); ctx.lineTo(-w/2 + 12, -26);
        ctx.lineTo(w/2 - 12, -26); ctx.lineTo(w/2 - 2, -20); ctx.lineTo(w/2, 0);
        ctx.closePath(); ctx.fill();

        ctx.fillStyle = '#181a1c'; ctx.fillRect(-w/2 + 10, -30, w - 20, 5);

        ctx.fillStyle = '#0f1115'; ctx.beginPath();
        ctx.moveTo(-w/2 + 14, -26); ctx.lineTo(-w/4 + 2, -50);
        ctx.lineTo(w/4 - 2, -50); ctx.lineTo(w/2 - 14, -26);
        ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#2b2e33'; ctx.lineWidth = 2; ctx.stroke();

        ctx.fillStyle = '#111'; ctx.fillRect(-w/2 + 8, -19, w - 16, 11);
        ctx.fillStyle = '#990000'; ctx.fillRect(-w/2 + 14, -16, 34, 5); ctx.fillRect(w/2 - 48, -16, 34, 5);
        ctx.fillStyle = '#080808'; ctx.fillRect(-w/2 + 4, 0, 24, 16); ctx.fillRect(w/2 - 28, 0, 24, 16);
        ctx.restore();
    }

    // --- COCKPIT POV DRAWING WITH NITROUS PURGE VISUALS ---
    function drawInsideCockpit() {
        let dashY = canvas.height * 0.72; 
        
        ctx.fillStyle = '#141619'; ctx.fillRect(0, dashY, canvas.width, canvas.height - dashY); ctx.fillRect(0, 0, canvas.width, 30); 
        
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(canvas.width * 0.08, 30); ctx.lineTo(canvas.width * 0.03, dashY); ctx.lineTo(0, dashY); ctx.closePath(); ctx.fill();
        ctx.beginPath(); ctx.moveTo(canvas.width, 0); ctx.lineTo(canvas.width * 0.92, 30); ctx.lineTo(canvas.width * 0.97, dashY); ctx.lineTo(canvas.width, dashY); ctx.closePath(); ctx.fill();

        // COCKPIT NITROUS VISUAL PURGE EFFECT
        if (state.nosEngaged || (state.nosArmed && state.gas)) {
            ctx.fillStyle = 'rgba(0, 180, 255, 0.12)';
            ctx.fillRect(0, 30, canvas.width, dashY - 30);

            ctx.save();
            ctx.fillStyle = 'rgba(180, 230, 255, 0.65)';
            for (let i = 0; i < 5; i++) {
                let px1 = canvas.width * 0.28 + (Math.random() - 0.5) * 35;
                let py1 = dashY - 15 - (Math.random() * 85);
                let sz1 = 4 + Math.random() * 12;
                ctx.beginPath(); ctx.arc(px1, py1, sz1, 0, Math.PI * 2); ctx.fill();

                let px2 = canvas.width * 0.72 + (Math.random() - 0.5) * 35;
                let py2 = dashY - 15 - (Math.random() * 85);
                let sz2 = 4 + Math.random() * 12;
                ctx.beginPath(); ctx.arc(px2, py2, sz2, 0, Math.PI * 2); ctx.fill();
            }
            ctx.restore();
        }

        ctx.fillStyle = '#08090a'; ctx.fillRect(canvas.width * 0.56, 30, 110, 26);
        ctx.strokeStyle = '#333'; ctx.strokeRect(canvas.width * 0.56, 30, 110, 26);
        ctx.fillStyle = '#223'; ctx.fillRect(canvas.width * 0.58, 33, 102, 20);

        let clusterLeft = canvas.width * 0.5 - 130; let clusterWidth = 260;
        ctx.fillStyle = '#1c1e22'; ctx.beginPath(); ctx.moveTo(clusterLeft, dashY); ctx.lineTo(clusterLeft + 15, dashY - 45); ctx.lineTo(clusterLeft + clusterWidth - 15, dashY - 45); ctx.lineTo(clusterLeft + clusterWidth, dashY); ctx.closePath(); ctx.fill(); ctx.strokeStyle = '#111'; ctx.lineWidth = 2.5; ctx.stroke();
        ctx.fillStyle = '#0a0b0d'; ctx.fillRect(clusterLeft + 18, dashY - 39, clusterWidth - 36, 39);

        function drawCockpitGauge(cx, cy, radius, value, maxVal, label, color) {
            ctx.fillStyle = '#000'; ctx.beginPath(); ctx.arc(cx, cy, radius, 0, Math.PI * 2); ctx.fill();
            ctx.strokeStyle = '#2d3035'; ctx.lineWidth = 1.5; ctx.stroke();
            ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.beginPath();
            let startAng = Math.PI * 0.8; let endAng = Math.PI * 2.2;
            let currentAng = startAng + ((value / maxVal) * (endAng - startAng));
            ctx.arc(cx, cy, radius - 3, startAng, currentAng); ctx.stroke();
            ctx.strokeStyle = '#ff3300'; ctx.lineWidth = 1.5; ctx.beginPath();
            ctx.moveTo(cx, cy); ctx.lineTo(cx + Math.cos(currentAng) * (radius - 5), cy + Math.sin(currentAng) * (radius - 5)); ctx.stroke();
            ctx.fillStyle = '#aaa'; ctx.font = 'bold 8px Helvetica'; ctx.textAlign = 'center'; ctx.fillText(label, cx, cy + radius - 9);
        }

        let gaugeY = dashY - 18;
        drawCockpitGauge(clusterLeft + 60, gaugeY, 19, state.rpm, MAX_RPM, "RPM", '#ffcc00');
        drawCockpitGauge(clusterLeft + 125, gaugeY, 19, state.speed * 0.681818, 160, "MPH", '#00ffcc');
        
        ctx.fillStyle = '#151515'; ctx.fillRect(clusterLeft + 172, dashY - 28, 22, 18);
        ctx.fillStyle = state.shiftError ? '#ff0000' : '#00ff00'; ctx.font = 'bold 12px monospace'; ctx.textAlign = 'center';
        ctx.fillText(state.gear !== 0 ? state.gear : (state.shiftError ? state.attemptedGear : "N"), clusterLeft + 183, dashY - 15);

        // NOS Cockpit LED Light on dash
        ctx.fillStyle = state.nosEngaged ? '#00e5ff' : (state.nosArmed ? '#ff3333' : '#112233');
        ctx.fillRect(clusterLeft + 15, dashY - 28, 16, 10);
        ctx.strokeStyle = '#333'; ctx.strokeRect(clusterLeft + 15, dashY - 28, 16, 10);

        let lightColor = (state.rpm >= REDLINE) ? '#ff0000' : '#220000';
        ctx.fillStyle = '#08080a'; ctx.fillRect(clusterLeft + clusterWidth - 8, dashY - 52, 22, 22); 
        ctx.fillStyle = lightColor; ctx.beginPath(); ctx.arc(clusterLeft + clusterWidth + 3, dashY - 41, 8, 0, Math.PI*2); ctx.fill();
        ctx.strokeStyle = '#444'; ctx.stroke();

        let wheelX = canvas.width * 0.5 - 10; let wheelY = dashY + 32;
        ctx.save(); ctx.strokeStyle = '#0d0d0f'; ctx.lineWidth = 11; ctx.shadowColor = '#000'; ctx.shadowBlur = 8; ctx.beginPath(); ctx.arc(wheelX, wheelY, 65, 0, Math.PI * 2); ctx.stroke(); ctx.restore();
        ctx.fillStyle = '#1c1e22'; ctx.beginPath(); ctx.arc(wheelX, wheelY, 15, 0, Math.PI*2); ctx.fill(); ctx.strokeStyle = '#111'; ctx.stroke();
    }

    // --- MAIN GAME LOOP ENGINE ---
    function unifiedGameLoop() {
        let now = performance.now();
        let dt = (now - lastTime) / 1000;
        lastTime = now;

        if (dt > 0.1) dt = 0.1;

        updatePhysics(dt);
        updateHUD(); 
        draw();

        requestAnimationFrame(unifiedGameLoop);
    }

    requestAnimationFrame(unifiedGameLoop);
</script>
