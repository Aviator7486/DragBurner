<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, orientation=landscape">
    <title>SAC Flight Line Escort - Turner AFB</title>
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            margin: 0;
            padding: 0;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #050508;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        /* Base Game Container optimized for cross-device scaling */
        #game-container {
            position: absolute;
            width: 932px;
            height: 430px;
            background: #000;
            overflow: hidden;
            border: 4px solid #333;
            border-radius: 40px;
            transform-origin: center center;
            box-shadow: 0 0 35px rgba(0,0,0,0.9);
            touch-action: none;
        }

        canvas {
            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Top HUD Configuration */
        #hud {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            display: flex;
            gap: 15px;
            background: rgba(5, 5, 10, 0.65);
            padding: 8px 16px;
            border-radius: 10px;
            border: 1px solid rgba(85, 85, 85, 0.6);
            color: #fff;
            pointer-events: none;
            font-weight: bold;
            font-size: 12px;
            letter-spacing: 0.5px;
        }
        .hud-val { color: #00ffcc; }
        .hud-alert { color: #ff3333; }

        /* Tactical Spotter Radio Box Container */
        #spotter-radio-box {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 10;
            background: rgba(0, 0, 5, 0.82);
            padding: 6px 20px;
            border-radius: 8px;
            border: 2px solid rgba(255, 204, 0, 0.9);
            color: #ffcc00;
            font-weight: bold;
            font-size: 13px;
            letter-spacing: 0.5px;
            text-align: center;
            min-width: 380px;
            box-shadow: 0 0 18px rgba(255, 204, 0, 0.35);
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s ease-in-out;
        }
        #spotter-radio-box.active {
            opacity: 1;
        }

        /* Control Pedal Infrastructure */
        .control-zone {
            position: absolute;
            bottom: 15px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            opacity: 0.72;
            transition: opacity 0.2s;
        }
        .control-zone:hover { opacity: 0.95; }
        #left-controls { left: 30px; width: 110px; height: 224px; }
        #right-controls { right: 30px; width: 216px; height: 312px; }

        .btn {
            background: linear-gradient(135deg, rgba(51,51,51,0.7), rgba(17,17,17,0.7));
            border: 3px solid rgba(85,85,85,0.8);
            color: #fff;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.2), 0 4px 6px rgba(0,0,0,0.6);
        }
        .btn:active, .btn.active {
            background: linear-gradient(135deg, rgba(17,17,17,0.85), rgba(0,0,0,0.85));
            border-color: #888;
            box-shadow: inset 0 3px 5px rgba(0,0,0,0.8);
        }

        #btn-gas { height: 110px; background: linear-gradient(135deg, rgba(34,139,34,0.75), rgba(0,77,0,0.75)); border-color: rgba(0,255,0,0.8); font-size: 20px; }
        #btn-clutch-l { height: 99px; background: linear-gradient(135deg, rgba(68,68,68,0.7), rgba(34,34,34,0.7)); border-color: rgba(119,119,119,0.8); font-size: 16px; } 
        #btn-clutch-r { height: 45px; background: linear-gradient(135deg, rgba(68,68,68,0.7), rgba(34,34,34,0.7)); border-color: rgba(119,119,119,0.8); font-size: 14px; width: 100%; } 

        .top-btn {
            position: absolute;
            z-index: 9999;
            padding: 8px 12px;
            background: rgba(34, 34, 34, 0.65);
            color: #fff;
            border: 2px solid rgba(85, 85, 85, 0.8);
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            width: 145px;
            height: 34px;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.15s, border-color 0.15s, color 0.15s, opacity 0.15s;
            opacity: 0.75;
        }
        .top-btn:hover {
            background: rgba(51, 51, 51, 0.9);
            border-color: #00ffcc;
            color: #00ffcc;
            opacity: 1.0;
        }
        .top-btn:active {
            background: #00ffcc;
            color: #000;
            border-color: #fff;
        }
        #sound-toggle { top: 15px; left: 20px; border-color: rgba(255, 51, 51, 0.8); color: #ff3333; }
        #initiate-btn { top: 15px; right: 20px; background: rgba(212, 163, 115, 0.75); color: #000; border: 2px solid #fff; }
        #initiate-btn:hover { background: rgba(226, 180, 140, 0.95); border-color: #fff; color: #000; }

        .shifter-quadrant {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 6px;
            height: 198px; 
            background: rgba(26, 26, 26, 0.65);
            padding: 6px;
            border-radius: 14px;
            border: 3px solid rgba(68, 68, 68, 0.8);
        }
        .shift-gate {
            background: rgba(10, 10, 10, 0.65);
            border: 2px solid rgba(37, 37, 37, 0.8);
            color: #888;
            font-size: 21px; 
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
        }
        .shifter-quadrant .shift-gate.active {
            background: #ffcc00 !important;
            color: #000 !important;
            border-color: #fff !important;
            box-shadow: 0 0 8px #ffcc00 !important;
            opacity: 1 !important;
        }
        .shift-gate.blank { opacity: 0.15; }
    </style>
</head>
<body>

<div id="game-container">
    <button id="sound-toggle" class="top-btn">🔇 SOUND: OFF</button>
    <button id="initiate-btn" class="top-btn">COMMENCE ESCORT</button>

    <div id="hud">
        <div>RUNWAY DIST: <span id="hud-dist" class="hud-val">0 ft</span></div>
        <div>GEAR: <span id="hud-gear" class="hud-val">N</span></div>
        <div>RPM: <span id="hud-rpm" class="hud-val">1000</span></div>
        <div>CHASE MPH: <span id="hud-mph" class="hud-val">0</span></div>
        <div>BUFFER: <span id="hud-buffer" class="hud-val">STANDBY</span></div>
    </div>

    <div id="spotter-radio-box">RADIO: WAITING AT THRESHOLD...</div>

    <div class="control-zone" id="left-controls">
        <div class="btn" id="btn-gas">GAS</div>
        <div class="btn" id="btn-clutch-l">CLUTCH</div>
    </div>

    <div class="control-zone" id="right-controls">
        <div style="height: 45px; width: 100%;"></div> 
        
        <div class="shifter-quadrant" id="quadrant-zone">
            <div class="shift-gate" data-gear="1" data-x="0" data-y="0">1</div>
            <div class="shift-gate" data-gear="3" data-x="1" data-y="0">3</div>
            <div class="shift-gate" data-gear="5" data-x="2" data-y="0">5</div>
            <div class="shift-gate blank" data-x="0" data-y="1"></div>
            <div class="shift-gate active" data-gear="0" data-x="1" data-y="1">N</div>
            <div class="shift-gate blank" data-x="2" data-y="1"></div>
            <div class="shift-gate" data-gear="2" data-x="0" data-y="2">2</div>
            <div class="shift-gate" data-gear="4" data-x="1" data-y="2">4</div>
            <div class="shift-gate" data-gear="6" data-x="2" data-y="2">6</div>
        </div>

        <div class="btn" id="btn-clutch-r">CLUTCH</div>
    </div>

    <canvas id="gameCanvas"></canvas>
</div>

<script>
    const container = document.getElementById('game-container');
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    function scaleGameViewport() {
        const baseWidth = 932;
        const baseHeight = 430;
        let scaleFactor = Math.min(window.innerWidth / baseWidth, window.innerHeight / baseHeight);
        container.style.transform = `scale(${scaleFactor})`;
        canvas.width = baseWidth;
        canvas.height = baseHeight;
    }
    window.addEventListener('resize', scaleGameViewport);
    scaleGameViewport();

    let state = {
        missionState: 'idle', // 'idle', 'approaching', 'chase', 'failed', 'secured'
        time: 0,
        chaseStartTime: 0,
        distance: 0, speed: 0, gear: 0, attemptedGear: 0, rpm: 1000,
        planeDistance: -15, planeSpeed: 160, planeAltitude: 55, planeTilt: 0,
        clutchLeft: false, clutchRight: false, gas: false, autoPlay: false,
        logMsg: "", shiftError: false, radioMsg: "", radioTimer: 0,
        calledAlts: new Set(),
        muted: true, smokePuffs: [], carSmokeTimer: 0,
        closeYellowTimer: 0, hasEstablishedChase: false, abortTriggered: false
    };

    // Authentic U-2 Chase Pilot Altitude Callouts
    const ALT_CALLOUTS = [
        { alt: 50, text: "RADIO: 50 FEET...", duration: 2.4 },
        { alt: 40, text: "RADIO: 40 FEET...", duration: 2.2 },
        { alt: 30, text: "RADIO: 30 FEET...", duration: 2.0 },
        { alt: 20, text: "RADIO: 20 FEET...", duration: 2.0 },
        { alt: 10, text: "RADIO: 10 FEET...", duration: 1.9 },
        { alt: 5,  text: "RADIO: 5 FEET...",  duration: 1.6 },
        { alt: 3,  text: "RADIO: 3 FEET...",  duration: 1.6 },
        { alt: 2,  text: "RADIO: 2 FEET...",  duration: 1.6 },
        { alt: 1,  text: "RADIO: 1 FOOT... HOLD OFF...", duration: 2.2 }
    ];

    let shifterX = 1; 
    let shifterY = 1; 
    let lastTime = performance.now();

    const MAX_RPM = 7500;
    const REDLINE = 6800;
    const IDLE_RPM = 1000;
    const GEAR_RATIOS = [0, 2.90, 2.10, 1.64, 1.33, 1.10, 0.92]; 
    const FINAL_DRIVE = 4.10;
    const VELOCITY_CONSTANT = 6.989; 

    // --- SYNTHESIZED AUDIO ENGINE (PURE WEBAUDIO DIRECT ROUTING) ---
    const AudioEngine = {
        ctx: null, masterGain: null,
        engineOsc1: null, engineOsc2: null, engineGain: null,
        windNoiseNode: null, windGainNode: null, 
        jetNoiseNode: null, jetFilter: null, jetGainNode: null,
        jetTurbine: null, jetTurbineGain: null,
        squealOsc: null, squealGain: null, squealFilter: null,
        initialized: false, initializing: false,

        async init() {
            if (this.initialized) {
                if (this.ctx && this.ctx.state === 'suspended') await this.ctx.resume();
                return;
            }
            if (this.initializing) return; this.initializing = true;
            try {
                this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                this.masterGain = this.ctx.createGain();
                this.masterGain.connect(this.ctx.destination);
                this.masterGain.gain.setValueAtTime(state.muted ? 0 : 1, this.ctx.currentTime);

                // Car Powertrain Synthesis
                this.engineOsc1 = this.ctx.createOscillator();
                this.engineOsc2 = this.ctx.createOscillator();
                this.engineGain = this.ctx.createGain();
                this.engineOsc1.type = 'sawtooth'; this.engineOsc2.type = 'triangle';

                let lowpass = this.ctx.createBiquadFilter(); lowpass.type = 'lowpass';
                lowpass.frequency.setValueAtTime(280, this.ctx.currentTime);
                this.engineOsc1.connect(lowpass); this.engineOsc2.connect(lowpass);
                lowpass.connect(this.engineGain); this.engineGain.connect(this.masterGain);
                this.engineGain.gain.setValueAtTime(0.12, this.ctx.currentTime);
                this.engineOsc1.start(0); this.engineOsc2.start(0);

                // Wind Ambience Noise
                let bufferSize = 2 * this.ctx.sampleRate;
                let noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
                let output = noiseBuffer.getChannelData(0);
                for (let i = 0; i < bufferSize; i++) output[i] = Math.random() * 2 - 1;

                this.windNoiseNode = this.ctx.createBufferSource();
                this.windNoiseNode.buffer = noiseBuffer; this.windNoiseNode.loop = true;
                let windFilter = this.ctx.createBiquadFilter(); windFilter.type = 'lowpass';
                windFilter.frequency.setValueAtTime(180, this.ctx.currentTime);
                this.windGainNode = this.ctx.createGain(); this.windGainNode.gain.setValueAtTime(0.0, this.ctx.currentTime);
                this.windNoiseNode.connect(windFilter); windFilter.connect(this.windGainNode);
                this.windGainNode.connect(this.masterGain); this.windNoiseNode.start(0);

                // --- PURE PINK NOISE JET TURBINE & EXHAUST ROAR ---
                let jetBufSize = 3 * this.ctx.sampleRate;
                let jetNoiseBuffer = this.ctx.createBuffer(1, jetBufSize, this.ctx.sampleRate);
                let jetData = jetNoiseBuffer.getChannelData(0);
                let p0=0, p1=0, p2=0, p3=0, p4=0, p5=0, p6=0;
                for (let i = 0; i < jetBufSize; i++) {
                    let w = Math.random() * 2 - 1;
                    p0 = 0.99886 * p0 + w * 0.0555179;
                    p1 = 0.99332 * p1 + w * 0.0750759;
                    p2 = 0.96900 * p2 + w * 0.1538520;
                    p3 = 0.86650 * p3 + w * 0.3104856;
                    p4 = 0.55000 * p4 + w * 0.5329522;
                    p5 = -0.7616 * p5 - w * 0.0168980;
                    jetData[i] = (p0 + p1 + p2 + p3 + p4 + p5 + p6 + w * 0.5362) * 0.09;
                    p6 = w * 0.115926;
                }

                this.jetNoiseNode = this.ctx.createBufferSource();
                this.jetNoiseNode.buffer = jetNoiseBuffer;
                this.jetNoiseNode.loop = true;

                this.jetFilter = this.ctx.createBiquadFilter();
                this.jetFilter.type = 'lowpass';
                this.jetFilter.frequency.setValueAtTime(150, this.ctx.currentTime);

                this.jetGainNode = this.ctx.createGain();
                this.jetGainNode.gain.setValueAtTime(0.0, this.ctx.currentTime);

                this.jetTurbine = this.ctx.createOscillator();
                this.jetTurbine.type = 'sine';
                this.jetTurbine.frequency.setValueAtTime(1450, this.ctx.currentTime); 

                this.jetTurbineGain = this.ctx.createGain();
                this.jetTurbineGain.gain.setValueAtTime(0.0, this.ctx.currentTime);

                this.jetNoiseNode.connect(this.jetFilter);
                this.jetFilter.connect(this.jetGainNode);
                this.jetGainNode.connect(this.masterGain);

                this.jetTurbine.connect(this.jetTurbineGain);
                this.jetTurbineGain.connect(this.masterGain);

                this.jetNoiseNode.start(0);
                this.jetTurbine.start(0);

                // --- CONTINUOUS TIRE SQUEAL SYNTHESIZER ---
                this.squealOsc = this.ctx.createOscillator();
                this.squealOsc.type = 'sawtooth';
                this.squealOsc.frequency.setValueAtTime(1850, this.ctx.currentTime);

                this.squealFilter = this.ctx.createBiquadFilter();
                this.squealFilter.type = 'bandpass';
                this.squealFilter.frequency.setValueAtTime(2100, this.ctx.currentTime);
                this.squealFilter.Q.setValueAtTime(4.5, this.ctx.currentTime);

                this.squealGain = this.ctx.createGain();
                this.squealGain.gain.setValueAtTime(0.0, this.ctx.currentTime);

                this.squealOsc.connect(this.squealFilter);
                this.squealFilter.connect(this.squealGain);
                this.squealGain.connect(this.masterGain);
                this.squealOsc.start(0);

                this.initialized = true;
            } catch (e) { console.error("Audio Engine setup failed:", e); } finally { this.initializing = false; }
        },

        setMute(isMuted) {
            if (!this.initialized) return;
            this.masterGain.gain.setValueAtTime(isMuted ? 0 : 1, this.ctx.currentTime);
            if (isMuted && 'speechSynthesis' in window) window.speechSynthesis.cancel();
        },

        update(rpm, speed, gas, isSpinning) {
            if (!this.initialized) return;
            let baseFreq = 22 + (rpm / 24);
            this.engineOsc1.frequency.setValueAtTime(baseFreq, this.ctx.currentTime);
            this.engineOsc2.frequency.setValueAtTime(baseFreq * 0.5, this.ctx.currentTime);
            let loadGain = gas ? 0.22 : 0.08; if (state.gear === 0) loadGain *= 0.7;
            this.engineGain.gain.setValueAtTime(loadGain, this.ctx.currentTime);
            let mph = speed * 0.681818;
            this.windGainNode.gain.setValueAtTime(Math.min(mph / 320, 0.25), this.ctx.currentTime);

            if (isSpinning && !state.muted) {
                let targetGain = Math.min(0.28, 0.12 + (rpm / 7500) * 0.18);
                this.squealGain.gain.setValueAtTime(targetGain, this.ctx.currentTime);
                let sqPitch = 1750 + (speed * 8.0) + (Math.random() * 80);
                this.squealOsc.frequency.setValueAtTime(sqPitch, this.ctx.currentTime);
            } else {
                this.squealGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
            }

            if (state.missionState !== 'idle') {
                let dx = state.planeDistance - state.distance;
                let dy = state.planeAltitude * 10;
                let dist = Math.sqrt(dx * dx + dy * dy);

                let maxDist = 1200;
                let proxFactor = Math.max(0, Math.min(1, 1 - (dist / maxDist)));

                let jetVol = Math.pow(proxFactor, 1.2) * 0.75;
                let cutoffFreq = 120 + (proxFactor * 680); 
                let turbineWhineVol = Math.pow(proxFactor, 2.0) * 0.035;

                this.jetGainNode.gain.setValueAtTime(jetVol, this.ctx.currentTime);
                this.jetFilter.frequency.setValueAtTime(cutoffFreq, this.ctx.currentTime);
                this.jetTurbineGain.gain.setValueAtTime(turbineWhineVol, this.ctx.currentTime);
            } else {
                this.jetGainNode.gain.setValueAtTime(0.0, this.ctx.currentTime);
                this.jetTurbineGain.gain.setValueAtTime(0.0, this.ctx.currentTime);
            }
        },

        playTireChirp() {
            if (!this.initialized || state.muted) return;
            let osc = this.ctx.createOscillator();
            let gain = this.ctx.createGain();
            let filter = this.ctx.createBiquadFilter();

            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(2400, this.ctx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1300, this.ctx.currentTime + 0.16);

            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(2200, this.ctx.currentTime);
            filter.Q.setValueAtTime(4.0, this.ctx.currentTime);

            gain.gain.setValueAtTime(0.38, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.16);

            osc.connect(filter);
            filter.connect(gain);
            gain.connect(this.masterGain);

            osc.start(0);
            osc.stop(this.ctx.currentTime + 0.16);
        },

        playTone(freq, type, duration, volume) {
            if (!this.initialized || state.muted) return;
            let osc = this.ctx.createOscillator(); let gain = this.ctx.createGain();
            osc.type = type; osc.frequency.setValueAtTime(freq, this.ctx.currentTime);
            gain.gain.setValueAtTime(volume, this.ctx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + duration);
            osc.connect(gain); gain.connect(this.masterGain);
            osc.start(0); osc.stop(this.ctx.currentTime + duration);
        },

        playRadioSquelch() {
            if (!this.initialized || state.muted) return;
            let bufferSize = Math.floor(this.ctx.sampleRate * 0.08);
            let noiseBuffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
            let output = noiseBuffer.getChannelData(0);
            for (let i = 0; i < bufferSize; i++) output[i] = (Math.random() * 2 - 1) * 0.25;

            let whiteNoise = this.ctx.createBufferSource();
            whiteNoise.buffer = noiseBuffer;
            let bandpass = this.ctx.createBiquadFilter();
            bandpass.type = 'bandpass';
            bandpass.frequency.setValueAtTime(1200, this.ctx.currentTime);
            bandpass.Q.setValueAtTime(2.5, this.ctx.currentTime);

            whiteNoise.connect(bandpass);
            bandpass.connect(this.masterGain);
            whiteNoise.start(0);
        }
    };

    // --- DUAL-ROLE VOICE SYNTHESIZER ENGINE ---
    const VoiceEngine = {
        speak(text, role = 'spotter') {
            if (state.muted || !('speechSynthesis' in window)) return;

            window.speechSynthesis.cancel();

            let spokenText = text.replace(/^RADIO:\s*/i, '')
                                 .replace(/\.\.\.$/, '')
                                 .replace(/!/g, '');

            spokenText = spokenText.replace(/\bpace\b/gi, 'payce');

            let utterance = new SpeechSynthesisUtterance(spokenText);
            let voices = window.speechSynthesis.getVoices();

            if (role === 'pilot') {
                utterance.rate = 0.95;
                utterance.pitch = 0.88;
                utterance.volume = 1.0;
                let pilotVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('George') || v.name.includes('Natural') || v.name.includes('Google') || v.name.includes('UK')));
                if (pilotVoice) utterance.voice = pilotVoice;
            } else {
                utterance.rate = 0.82;  
                utterance.pitch = 0.45; 
                utterance.volume = 1.0;
                let spotterVoice = voices.find(v => v.lang.startsWith('en') && (v.name.includes('Male') || v.name.includes('David') || v.name.includes('George') || v.name.includes('Google') || v.name.includes('Natural')));
                if (spotterVoice) utterance.voice = spotterVoice;
            }

            window.speechSynthesis.speak(utterance);
        }
    };

    if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => { window.speechSynthesis.getVoices(); };
    }

    const UI = {
        gas: document.getElementById('btn-gas'),
        clutchL: document.getElementById('btn-clutch-l'), clutchR: document.getElementById('btn-clutch-r'),
        sound: document.getElementById('sound-toggle'), initiate: document.getElementById('initiate-btn'),
        quadrant: document.getElementById('quadrant-zone'), gates: document.querySelectorAll('.shift-gate'),
        hudDist: document.getElementById('hud-dist'), hudGear: document.getElementById('hud-gear'),
        hudRpm: document.getElementById('hud-rpm'), hudMph: document.getElementById('hud-mph'),
        hudBuffer: document.getElementById('hud-buffer'), radioBox: document.getElementById('spotter-radio-box')
    };

    let audioUnlocked = false;
    async function unlockAudio() {
        if (audioUnlocked) return; audioUnlocked = true;
        await AudioEngine.init();
    }

    function spawnCarTireSmoke(count = 3) {
        for (let i = 0; i < count; i++) {
            state.smokePuffs.push({
                d: state.distance - 3.5 - Math.random() * 2.0,
                laneOffset: -1.0 + (Math.random() - 0.5) * 0.22,

    function attemptMoveShifter(tx, ty) {
        if (state.autoPlay) return;
        let currentY = shifterY;
        let clutchPressed = state.clutchLeft || state.clutchRight;
        
        if (currentY === 1 && (ty === 0 || ty === 2)) {
            let targetGear = 0;
            if (ty === 0) targetGear = [1, 3, 5][tx];
            else if (ty === 2) targetGear = [2, 4, 6][tx];
            
            if (clutchPressed) {
                shifterX = tx; shifterY = ty; state.shiftError = false;
                if (state.gear !== targetGear) {
                    let oldRpm = state.rpm;
                    state.gear = targetGear;
                    
                    if (state.gear !== 0) {
                        if ((state.gear === 2 || state.gear === 3) && oldRpm > 4200 && state.gas) {
                            AudioEngine.playTireChirp();
                            spawnCarTireSmoke(5);
                        } else {
                            AudioEngine.playTone(580, 'sine', 0.04, 0.25);
                        }
                    }
                }
            } else {
                shifterX = tx; shifterY = 1; state.gear = 0; state.attemptedGear = targetGear; state.shiftError = true;
                AudioEngine.playTone(140, 'sawtooth', 0.22, 0.35);
            }
        } 
        else if (((currentY === 0 || currentY === 2) && ty === 1) || (currentY === 1 && ty === 1)) {
            shifterX = tx; shifterY = 1; state.gear = 0; state.shiftError = false;
        }
        updateShifterVisuals();
    }

    function processShiftAtCoords(clientX, clientY) {
        let targetElement = document.elementFromPoint(clientX, clientY);
        if (targetElement && targetElement.classList.contains('shift-gate')) {
            let tx = parseInt(targetElement.getAttribute('data-x'));
            let ty = parseInt(targetElement.getAttribute('data-y'));
            if (shifterX !== tx || shifterY !== ty) {
                if ((Math.abs(tx - shifterX) + Math.abs(ty - shifterY) === 1) && (shifterY === 1 ? true : ty === 1)) {
                    attemptMoveShifter(tx, ty);
                }
            }
        }
    }

            case 'arrowdown': if (shifterY < 2) attemptMoveShifter(shifterX, shifterY + 1); break;
            case 'arrowleft': if (shifterY === 1 && shifterX > 0) attemptMoveShifter(shifterX - 1, shifterY); break;
            case 'arrowright': if (shifterY === 1 && shifterX < 2) attemptMoveShifter(shifterX + 1, shifterY); break;
        }
    });

    function getProjection(objDistance, laneOffset = 0) {
        let diff = objDistance - state.distance;
        let horizon = canvas.height * 0.45; let playerY = canvas.height * 0.85; let horizonX = canvas.width * 0.5; 
        
        let transformFactor = 1 + diff * 0.012;
        if (transformFactor < 0.1) transformFactor = 0.1; 

        let y = horizon + (playerY - horizon) / transformFactor;
        let scale = (y - horizon) / (playerY - horizon);
        let laneSpacing = canvas.width * 0.24;
        let x = horizonX + laneOffset * laneSpacing * scale;
        
        return { x: x, y: y, scale: scale, visible: (diff >= -150 && diff < 1200) };
    }

    // --- REAL-TIME PHYSICAL TIME ENVIRONMENT MATRIX ---
    function updatePhysics(dt) {
        let clutchPressed = state.clutchLeft || state.clutchRight;

        if (state.radioTimer > 0) {
            state.radioTimer -= dt;
            if (state.radioTimer <= 0) {
                state.radioTimer = 0;
                UI.radioBox.classList.remove('active');
            }
        }

        let isTireSpinning = false;

        if (state.autoPlay) {
            let targetChaseDistance = state.planeDistance - 48; 
            let distanceGapError = targetChaseDistance - state.distance;
            
            state.speed = state.planeSpeed + distanceGapError * 4.5;
            if (state.speed < 0) state.speed = 0;

            if (state.speed > 95) state.gear = 5;
            else if (state.speed > 70) state.gear = 4;
            else if (state.speed > 45) state.gear = 3;
            else if (state.speed > 20) state.gear = 2;
            else if (state.speed > 1) state.gear = 1;
            else state.gear = 0; 

            if (state.gear > 0) {
                let ratioMult = GEAR_RATIOS[state.gear] * FINAL_DRIVE * VELOCITY_CONSTANT;
                state.rpm = IDLE_RPM + (state.speed * ratioMult);
            } else {
                state.rpm = state.rpm > IDLE_RPM ? state.rpm - 3500 * dt : IDLE_RPM;
            }
            if (state.rpm > REDLINE) state.rpm = REDLINE;

            shifterY = (state.gear === 0) ? 1 : (state.gear % 2 !== 0 ? 0 : 2);
            shifterX = (state.gear === 0) ? 1 : Math.floor((state.gear - 1) / 2);
            updateShifterVisuals();
        } 
        else {
            if (state.gear === 0 || clutchPressed) {
                if (state.gas) { state.rpm += 18000 * dt; if (state.rpm > MAX_RPM) state.rpm = MAX_RPM - 150; } 
                else { state.rpm -= 7000 * dt; if (state.rpm < IDLE_RPM) state.rpm = IDLE_RPM; }
                state.speed = Math.max(0, state.speed - (state.speed * state.speed * 0.0004 + 4.0) * dt);
            } else {
                let ratioMult = GEAR_RATIOS[state.gear] * FINAL_DRIVE * VELOCITY_CONSTANT;
                let mechanicalRpm = IDLE_RPM + (state.speed * ratioMult);
                if (mechanicalRpm > MAX_RPM) { state.speed += -400 * dt; state.rpm = MAX_RPM; state.shiftError = true; } 
                else { state.rpm = state.rpm > mechanicalRpm ? state.rpm - (state.rpm - mechanicalRpm) * 12 * dt : mechanicalRpm; }

                let torqueFactor = 0;
                if (state.rpm < 2000) torqueFactor = 0.15 + ((state.rpm - IDLE_RPM) / 1000) * 0.25;
                else if (state.rpm < 4500) torqueFactor = 0.40 + ((state.rpm - 2000) / 2500) * 0.55;
                else if (state.rpm <= 6800) torqueFactor = 0.95 + Math.sin(((state.rpm - 4500) / 2300) * Math.PI) * 0.05;
                else torqueFactor = 1.0 - (Math.pow((state.rpm - 6800) / (MAX_RPM - 6800), 2) * 0.35);

                // 1st Gear Launch Wheelspin
                if (state.gear === 1 && state.gas && state.rpm > 3200 && state.speed < 55) {
                    isTireSpinning = true;
                    state.carSmokeTimer += dt;
                    if (state.carSmokeTimer > 0.04) {
                        state.carSmokeTimer = 0;
                        spawnCarTireSmoke(1);
                    }
                }

                let engineForce = state.gas ? (torqueFactor * GEAR_RATIOS[state.gear] * 45.0) : 0;
                let aeroDrag = state.speed * state.speed * 0.0005;
                state.speed = Math.max(0, state.speed + (engineForce - (aeroDrag + 8.0 + (state.gas ? 0 : 40.0))) * dt);
            }
        }

        state.distance += state.speed * dt;

        if (state.missionState !== 'idle') {
            state.time += dt;

            if (state.missionState === 'failed') {
                state.planeSpeed += 70 * dt;      
                state.planeAltitude += 28 * dt;   
                state.planeDistance += state.planeSpeed * dt;
            }
            else {
                state.planeDistance += state.planeSpeed * dt;

                if (state.planeDistance < 2500) {
                    let progress = state.planeDistance / 2500;
                    state.planeAltitude = 55 - (progress * 55); 
                    state.planeSpeed = 135 - (progress * 15);   
                    
                    for (let c of ALT_CALLOUTS) {
                        if (state.planeAltitude <= c.alt && !state.calledAlts.has(c.alt)) {
                            state.calledAlts.add(c.alt);
                            triggerRadioCall(c.text, c.duration, 'spotter');
                            break;
                        }
                    }
                } else {
                    if (state.planeAltitude > 0) {
                        state.planeAltitude = 0; state.planeSpeed = 120;
                        state.autoPlay = true; 
                        
                        if (!state.calledAlts.has(0)) {
                            state.calledAlts.add(0);
                            triggerRadioCall("RADIO: TOUCHDOWN, ROLL OUT!", 3.0, 'spotter');
                        }
                        
                        AudioEngine.playTone(330, 'sine', 0.2, 0.4);
                        for (let i = 0; i < 6; i++) {
                            state.smokePuffs.push({
                                d: state.planeDistance,
                                laneOffset: 0,
                                xOffset: (Math.random() - 0.5) * 16,
                                yOffset: 0,
                                life: 1.0, maxLife: 1.0,
                                startSize: 12, endSize: 47
                            });
                        }
                    }

                    let rolloutProgress = (state.planeDistance - 2500) / 4000;
                    if (rolloutProgress < 1.0) {
                        state.planeSpeed = 120 * (1.0 - rolloutProgress);
                        if (state.planeSpeed < 8) state.planeSpeed = 8;
                    } else {
                        state.planeSpeed = 0;
                        state.planeTilt += (14 - state.planeTilt) * 4 * dt; 
                        if (state.missionState === 'chase') {
                            state.missionState = 'secured'; state.logMsg = "TACTICAL OBJECTIVE SECURED: FLIGHT SYSTEM INTEGRATED!";
                            AudioEngine.playTone(660, 'sine', 0.5, 0.3);
                        }
                    }
                }
            }

            if (state.missionState === 'approaching') {
                if (state.planeDistance >= state.distance) {
                    state.missionState = 'chase';
                    state.chaseStartTime = state.time; 
                    triggerRadioCall("RADIO: ACCELERATE TO MATCH PACE...", 2.4, 'spotter');
                    AudioEngine.playTone(880, 'sine', 0.15, 0.3);
                }
            }

            // --- PROXIMITY ABORT MONITORING & DIALOGUE SEQUENCING ---
            if (state.missionState === 'chase' && !state.autoPlay && !state.abortTriggered) {
                let separation = state.planeDistance - state.distance;

                if (separation > 45) {
                    state.hasEstablishedChase = true;
                }

                if (state.hasEstablishedChase && separation >= 25 && separation < 40) {
                    state.closeYellowTimer += dt;
                } else {
                    state.closeYellowTimer = 0;
                }

                let isCloseYellowAbort = state.hasEstablishedChase && state.closeYellowTimer >= 2.0;
                let isRedZoneAbort = state.hasEstablishedChase && separation < 25;
                let isFarZoneAbort = (state.time - state.chaseStartTime > 12.0) && (separation > 160);

                if (isCloseYellowAbort || isRedZoneAbort || isFarZoneAbort) {
                    state.abortTriggered = true;
                    state.missionState = 'failed';
                    state.logMsg = isRedZoneAbort ? "CRITICAL PROXIMITY: DANGER ZONE PENETRATED! GO-AROUND!" : "MISSION FAILURE: ABORT EXECUTED BY COMMAND!";

                    triggerRadioCall("RADIO: ABORT! ABORT! ABORT!", 2.2, 'spotter');
                    AudioEngine.playTone(140, 'sawtooth', 0.6, 0.4);

                    setTimeout(() => {
                        if (state.missionState === 'failed') {
                            triggerRadioCall("RADIO: LANDING ABORTED, GOING AROUND.", 2.8, 'pilot');
                        }
                    }, 2300);
                }
            }
        }

        state.smokePuffs.forEach(p => { p.life -= dt * 1.5; });
        state.smokePuffs = state.smokePuffs.filter(p => p.life > 0);
        AudioEngine.update(state.rpm, state.speed, state.gas, isTireSpinning);
    }

    function drawPerspectiveTrapezoid(dStart, dEnd, laneLeft, laneRight, fillStyle, strokeStyle = null) {
        let p1 = getProjection(dStart, laneLeft);
        let p2 = getProjection(dEnd, laneLeft);
        let p3 = getProjection(dEnd, laneRight);
        let p4 = getProjection(dStart, laneRight);

        if (p1.visible || p2.visible || p3.visible || p4.visible) {
            ctx.fillStyle = fillStyle; ctx.beginPath();
            ctx.moveTo(p1.x, p1.y); ctx.lineTo(p2.x, p2.y); ctx.lineTo(p3.x, p3.y); ctx.lineTo(p4.x, p4.y);
            ctx.closePath(); ctx.fill();
            if (strokeStyle) { ctx.strokeStyle = strokeStyle; ctx.lineWidth = 1 * p1.scale; ctx.stroke(); }
        }
    }

    function drawPerspectiveLineSegment(dStart, dEnd, laneOffset, strokeStyle, width) {
        let pStart = getProjection(dStart, laneOffset);
        let pEnd = getProjection(dEnd, laneOffset);
        if (pStart.visible && pEnd.visible) {
            ctx.strokeStyle = strokeStyle; ctx.lineWidth = width * pEnd.scale; ctx.beginPath();
            ctx.moveTo(pStart.x, pStart.y); ctx.lineTo(pEnd.x, pEnd.y);
            ctx.stroke(); 
        }
    }

        rGrad.addColorStop(0.74, 'rgba(255, 204, 0, 0.85)'); 
        rGrad.addColorStop(0.84, 'rgba(255, 204, 0, 0.85)');
        rGrad.addColorStop(0.88, 'rgba(255, 34, 34, 0.85)'); 
        rGrad.addColorStop(1.0, 'rgba(255, 34, 34, 0.85)');

        ctx.fillStyle = rGrad;
        ctx.fillRect(ribbonX, ribbonY, ribbonWidth, ribbonHeight);
        ctx.strokeStyle = 'rgba(17, 17, 17, 0.6)'; ctx.lineWidth = 0.8;
        ctx.strokeRect(ribbonX, ribbonY, ribbonWidth, ribbonHeight);

        let clampSep = Math.max(minSep, Math.min(maxSep, separation));
        let norm = 1 - ((clampSep - minSep) / (maxSep - minSep)); 
        let pointerY = ribbonY + norm * ribbonHeight;

        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.moveTo(ribbonX + ribbonWidth + 2, pointerY);
        ctx.lineTo(ribbonX + ribbonWidth + 9, pointerY - 5);
        ctx.lineTo(ribbonX + ribbonWidth + 9, pointerY + 5);
        ctx.closePath(); ctx.fill();

        let boxX = ribbonX + ribbonWidth + 10;
        let boxY = pointerY - 7;
        let boxW = width - boxX - 3;
        let boxH = 14;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 1; ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 9px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(Math.floor(separation) + 'f', boxX + boxW / 2, boxY + 10);

        ctx.restore();
    }

    function drawAltimeterTape(x, y, width, height) {
        ctx.save();
        ctx.translate(x, y);

        ctx.fillStyle = 'rgba(5, 8, 15, 0.45)';
        ctx.fillRect(0, 0, width, height);
        ctx.strokeStyle = 'rgba(51, 68, 85, 0.7)'; ctx.lineWidth = 1.2;
        ctx.strokeRect(0, 0, width, height);

        ctx.fillStyle = '#88aacc'; ctx.font = '8px Courier New'; ctx.textAlign = 'center';
        ctx.fillText('ALT(FT)', width / 2, -4);

        let tapeX = width - 8;
        let tapeY = 6;
        let tapeHeight = height - 12;

        let maxAlt = 60;
        let alt = state.planeAltitude;

        ctx.strokeStyle = '#556677'; ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(tapeX, tapeY); ctx.lineTo(tapeX, tapeY + tapeHeight);
        ctx.stroke();

        for (let a = 0; a <= maxAlt; a += 10) {
            let norm = 1 - (a / maxAlt); 
            let ty = tapeY + norm * tapeHeight;

            ctx.strokeStyle = '#8899aa';
            ctx.beginPath();
            ctx.moveTo(tapeX - 4, ty); ctx.lineTo(tapeX, ty);
            ctx.stroke();

            ctx.fillStyle = '#aaccdd'; ctx.font = '7px Courier New'; ctx.textAlign = 'right';
            ctx.fillText(a.toString(), tapeX - 6, ty + 2.5);
        }

        let clampAlt = Math.max(0, Math.min(maxAlt, alt));
        let normAlt = 1 - (clampAlt / maxAlt);
        let pointerY = tapeY + normAlt * tapeHeight;

        ctx.fillStyle = '#00ffcc';
        ctx.beginPath();
        ctx.moveTo(tapeX - 1, pointerY);
        ctx.lineTo(tapeX - 6, pointerY - 4);
        ctx.lineTo(tapeX - 6, pointerY + 4);
        ctx.closePath(); ctx.fill();

        let boxW = 24;
        let boxH = 12;
        let boxX = tapeX - 31;
        let boxY = pointerY - 6;

        ctx.fillStyle = 'rgba(0, 0, 0, 0.75)'; ctx.fillRect(boxX, boxY, boxW, boxH);
        ctx.strokeStyle = '#00ffcc'; ctx.lineWidth = 0.8; ctx.strokeRect(boxX, boxY, boxW, boxH);

        ctx.fillStyle = '#00ffcc'; ctx.font = 'bold 8px Courier New'; ctx.textAlign = 'center';
        ctx.fillText(Math.ceil(alt) + 'f', boxX + boxW / 2, boxY + 9);

        ctx.restore();
    }

    function draw() {
        let horizon = canvas.height * 0.45;
        let sky = ctx.createLinearGradient(0,0,0,horizon);
        sky.addColorStop(0, '#050a12'); sky.addColorStop(1, '#1b263b');
        ctx.fillStyle = sky; ctx.fillRect(0, 0, canvas.width, horizon);

        ctx.fillStyle = '#232329'; ctx.fillRect(0, horizon, canvas.width, canvas.height - horizon);

        // Seamless Runway Projection overdraw
        drawPerspectiveTrapezoid(state.distance - 60, state.distance + 1100, -2.2, 2.2, '#3a3a42');

        let totalWidth = 3.6; let numBars = 12; let barSpan = totalWidth / (numBars * 2 - 1);
        for (let i = 0; i < numBars; i++) {
            let bLeft = -1.8 + (i * 2 * barSpan); let bRight = bLeft + barSpan;
            drawPerspectiveTrapezoid(0, 45, bLeft, bRight, '#ffffff');
        }

        let nProj = getProjection(70, 0);
        if (nProj.visible) {
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.88)'; ctx.lineWidth = 6 * nProj.scale; ctx.lineCap = "round";
            let p2_1 = getProjection(78, -0.25), p2_2 = getProjection(78, -0.05), p2_3 = getProjection(74, -0.05);
            let p2_4 = getProjection(70, -0.25), p2_5 = getProjection(70, -0.05);
            ctx.beginPath(); ctx.moveTo(p2_1.x, p2_1.y); ctx.lineTo(p2_2.x, p2_2.y); ctx.lineTo(p2_3.x, p2_3.y); ctx.lineTo(p2_4.x, p2_4.y); ctx.lineTo(p2_5.x, p2_5.y); ctx.stroke();
            let p8_1 = getProjection(78, 0.05),  p8_2 = getProjection(78, 0.25),  p8_3 = getProjection(70, 0.25);
            let p8_4 = getProjection(70, 0.05),  p8_5 = getProjection(74, 0.05),  p8_6 = getProjection(74, 0.25);
            ctx.beginPath(); ctx.moveTo(p8_1.x, p8_1.y); ctx.lineTo(p8_2.x, p8_2.y); ctx.lineTo(p8_3.x, p8_3.y); ctx.lineTo(p8_4.x, p8_4.y); ctx.lineTo(p8_1.x, p8_1.y); ctx.moveTo(p8_5.x, p8_5.y); ctx.lineTo(p8_6.x, p8_6.y); ctx.stroke();
            ctx.lineCap = "butt";
        }

        for (let d = Math.floor((state.distance - 60) / 40) * 40; d < state.distance + 800; d += 40) {
            drawPerspectiveLineSegment(d, d + 18, -1.0, '#555', 3);
            drawPerspectiveLineSegment(d, d + 18, 1.0, '#555', 3);
        }

        // ================= MULTI-LANE SPATIAL SMOKE PARTICLES =================
        ctx.save();
        state.smokePuffs.forEach(p => {
            let proj = getProjection(p.d, p.laneOffset || 0);
            if (proj.visible) {
                let lifeRatio = p.life / (p.maxLife || 1.0);
                let progress = 1.0 - lifeRatio;
                let startSz = p.startSize || 12;
                let endSz = p.endSize || 47;
                let sz = (startSz + progress * (endSz - startSz)) * proj.scale;

                ctx.fillStyle = `rgba(220, 220, 230, ${lifeRatio * 0.42})`; 
                ctx.beginPath();
                ctx.arc(
                    proj.x + (p.xOffset || 0) * proj.scale, 
                    proj.y + (p.yOffset || 0) * proj.scale, 
                    sz, 0, Math.PI * 2
                ); 
                ctx.fill();
            }
        });
        ctx.restore();

        // ================= GROUND DROP SHADOW INTERCEPT =================
        if (state.missionState !== 'idle') {
            let shadowGroundProj = getProjection(state.planeDistance, 0);
            if (shadowGroundProj.visible) {
                ctx.save();
                ctx.translate(shadowGroundProj.x, shadowGroundProj.y);
                let shadowScale = shadowGroundProj.scale * 7.2; 
                ctx.scale(shadowScale, shadowScale * 0.32);

                let shadowAlpha = Math.max(0.04, 0.72 - (state.planeAltitude / 60) * 0.52);
                let blurRadius = Math.max(1, state.planeAltitude * 0.65);
                
                ctx.fillStyle = `rgba(0, 0, 0, ${shadowAlpha})`;
                ctx.shadowColor = `rgba(0, 0, 0, ${shadowAlpha})`;
                ctx.shadowBlur = blurRadius;

                ctx.beginPath();
                ctx.ellipse(0, -6, 175, 8, 0, 0, Math.PI * 2); 
                ctx.ellipse(0, 2, 8, 32, 0, 0, Math.PI * 2);    
                ctx.fill();
                ctx.restore();
            }
        }

        // ================= AIRFRAME POSITION ENGINE PASS =================
        if (state.missionState !== 'idle') {
            let planeProj = getProjection(state.planeDistance, 0);
            if (planeProj.visible) {
                let altYOffset = (state.planeAltitude * 5.0) * planeProj.scale; 
                drawU2DragonLady(planeProj.x, planeProj.y - altYOffset, planeProj.scale * 7.2, state.planeAltitude <= 3);
            }
        }

        let playerProj = getProjection(state.distance, -1);
        drawOutsideMustang(playerProj.x, playerProj.y, 1);

        // ================= MODERN PFD GLASS COCKPIT TAPES =================
        drawBufferTape(30, 70, 58, 100);
        drawAltimeterTape(854, 70, 48, 80);

        if (state.logMsg !== "") {
            ctx.font = 'bold 13px Courier New'; let m = ctx.measureText(state.logMsg);
            let bw = m.width + 40; let bh = 46; let bx = (canvas.width - bw) / 2; let by = (canvas.height - bh) / 2 - 10;
            ctx.fillStyle = 'rgba(2,2,6,0.94)'; ctx.fillRect(bx, by, bw, bh);
            ctx.strokeStyle = state.missionState === 'secured' ? '#00ffcc' : '#ff3333'; ctx.lineWidth = 2; ctx.strokeRect(bx, by, bw, bh);
            ctx.fillStyle = '#fff'; ctx.textBaseline = 'middle'; ctx.textAlign = 'center'; ctx.fillText(state.logMsg, canvas.width * 0.5, by + bh/2); ctx.textBaseline = 'alphabetic';
        }
    }

    function mainGameLoop() {
        let now = performance.now(); let dt = (now - lastTime) / 1000; lastTime = now;
        if (dt > 0.1) dt = 0.1;
        updatePhysics(dt); updateHUD(); draw();
        requestAnimationFrame(mainGameLoop);
    }
    requestAnimationFrame(mainGameLoop);
</script>
